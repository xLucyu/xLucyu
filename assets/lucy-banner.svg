<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Lucy | Software Development</title>
  <desc id="desc">Minimal black and charcoal GitHub profile banner featuring Lucy and a code editor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="55%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#24262c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#background)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <path d="M0 263H1200" stroke="#ffffff" stroke-opacity=".07"/>
  <rect x="78" y="68" width="4" height="181" rx="2" fill="#c4c7d0"/>
  <text x="107" y="149" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="700" letter-spacing="-2" fill="#f8f8fa">Lucy.</text>
  <text x="109" y="193" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#c2c4cc">Software Development</text>
  <text x="109" y="230" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="1.2" fill="#92949d">AUTOMATION  /  APIS  /  GAME TOOLS</text>
  <rect x="695" y="45" width="424" height="228" rx="13" fill="#0b0d11" stroke="#474a52" stroke-width="1.5"/>
  <path d="M708 45H1106A13 13 0 0 1 1119 58V83H695V58A13 13 0 0 1 708 45Z" fill="#1e2127"/>
  <circle cx="718" cy="65" r="4.5" fill="#777b84"/>
  <circle cx="735" cy="65" r="4.5" fill="#777b84"/>
  <circle cx="752" cy="65" r="4.5" fill="#777b84"/>
  <text x="902" y="70" font-family="monospace" font-size="12" text-anchor="middle" fill="#b5b8c0">profile.ts</text>
  <text x="721" y="117" font-family="monospace" font-size="17" fill="#a7acb6">const</text>
  <text x="775" y="117" font-family="monospace" font-size="17" fill="#f2f3f5">developer = {</text>
  <text x="744" y="151" font-family="monospace" font-size="16" fill="#a7acb6">name:</text>
  <text x="813" y="151" font-family="monospace" font-size="16" fill="#e1e4ea">'Lucy',</text>
  <text x="744" y="184" font-family="monospace" font-size="16" fill="#a7acb6">focus:</text>
  <text x="813" y="184" font-family="monospace" font-size="16" fill="#e1e4ea">'Development',</text>
  <text x="744" y="217" font-family="monospace" font-size="16" fill="#a7acb6">stack:</text>
  <text x="813" y="217" font-family="monospace" font-size="16" fill="#e1e4ea">'TypeScript',</text>
  <text x="721" y="252" font-family="monospace" font-size="17" fill="#f2f3f5">};</text>
  <rect x="695" y="45" width="424" height="228" rx="13" fill="url(#fade)" opacity=".12"/>
