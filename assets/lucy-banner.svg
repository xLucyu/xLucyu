  <path d="M630 58l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#fff" opacity=".65"/>
  <path d="M664 238l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#fff" opacity=".85"/>
  <circle cx="581" cy="38" r="4" fill="#fff" opacity=".8"/>
  <circle cx="43" cy="213" r="5" fill="#fff" opacity=".55"/>
  <circle cx="694" cy="161" r="3" fill="#fff" opacity=".9"/>
