      <stop offset="100%" stop-color="#322d56"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#624884" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <circle cx="85" cy="24" r="132" fill="#fff" opacity=".13"/>
  <circle cx="1150" cy="280" r="220" fill="#fff" opacity=".10"/>
  <circle cx="628" cy="320" r="182" fill="#fbddff" opacity=".16"/>
