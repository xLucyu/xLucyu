    <text x="851" y="196" fill="#c5f5df" font-family="monospace" font-size="17">'gaming',</text>
    <text x="782" y="230" fill="#c3bbff" font-family="monospace" font-size="17">vibe:</text>
    <text x="851" y="230" fill="#c5f5df" font-family="monospace" font-size="17">'cozy'</text>
    <text x="760" y="261" fill="#fef2ff" font-family="monospace" font-size="18">};</text>
