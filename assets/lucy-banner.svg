<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Lucy!</title>
  <desc id="desc">A pastel pink and lilac developer banner with a tiny code window and sparkles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7afcf"/>
      <stop offset="43%" stop-color="#d8b1f8"/>
      <stop offset="100%" stop-color="#9cbfff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
