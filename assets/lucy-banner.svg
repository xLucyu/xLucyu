  <text x="94" y="148" fill="#3d2c56" font-family="Verdana,DejaVu Sans,sans-serif" font-size="55" font-weight="700" letter-spacing="-2">hi, i'm lucy ♡</text>
  <text x="97" y="190" fill="#5b496e" font-family="Verdana,DejaVu Sans,sans-serif" font-size="23" font-weight="500">developer · tinkerer · gamer</text>
  <rect x="94" y="212" width="368" height="31" rx="15.5" fill="#fff" opacity=".54"/>
  <text x="115" y="232" fill="#6e4e75" font-family="Verdana,DejaVu Sans,sans-serif" font-size="14">welcome to my little corner of GitHub ✿</text>
  <g filter="url(#shadow)">
    <rect x="731" y="49" width="400" height="228" rx="20" fill="url(#card)"/>
    <rect x="731" y="49" width="400" height="45" rx="20" fill="#ffffff" opacity=".08"/>
