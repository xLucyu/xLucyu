    <text x="931" y="77" fill="#dfd2ee" font-family="monospace" font-size="13" text-anchor="middle">lucy.ts</text>
    <text x="760" y="127" fill="#f6bdde" font-family="monospace" font-size="18">const</text>
    <text x="826" y="127" fill="#fef2ff" font-family="monospace" font-size="18">lucy = {</text>
    <text x="782" y="162" fill="#c3bbff" font-family="monospace" font-size="17">loves:</text>
    <text x="851" y="162" fill="#c5f5df" font-family="monospace" font-size="17">'coding',</text>
